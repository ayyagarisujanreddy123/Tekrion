name: Public registry smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Tekrion version to install from npm
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: registry-smoke-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  install:
    name: npm install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TEKRION_VERSION: ${{ inputs.version }}
    steps:
      - name: Use minimum supported Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - name: Install and exercise the public CLI
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TEKRION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $TEKRION_VERSION" >&2
            exit 1
          fi

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          data_dir="$RUNNER_TEMP/tekrion-registry-home"
          npm install \
            --prefix "$install_dir" \
            --no-audit \
            --no-fund \
            --prefer-online \
            "@tekrion/cli@$TEKRION_VERSION"

          cli="$install_dir/node_modules/.bin/tekrion"
          actual_version="$("$cli" --version)"
          test "$actual_version" = "$TEKRION_VERSION"
          "$cli" --help >/dev/null
          "$cli" init --home "$data_dir"

          sessions="$("$cli" sessions --home "$data_dir" --json)"
          test "$sessions" = "[]"

          node -e '
            const http = require("node:http");
            const server = http.createServer((_request, response) => {
              response.writeHead(200, { "content-type": "application/json" });
              response.end("{}");
            });
            server.listen(46531, "127.0.0.1");
          ' &
          upstream_pid=$!
          trap 'kill "$upstream_pid" 2>/dev/null || true' EXIT
          sleep 1

          doctor="$("$cli" doctor \
            --home "$data_dir" \
            --upstream http://127.0.0.1:46531 \
            --json)"
          node -e '
            const report = JSON.parse(process.argv[1]);
            if (report.ok !== true) {
              throw new Error("tekrion doctor did not return ok=true");
            }
          ' "$doctor"

          npm audit signatures --prefix "$install_dir"
