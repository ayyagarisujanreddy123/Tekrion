name: Public registry smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Tekrion version to install from npm
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: registry-smoke-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  install:
    name: npm install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TEKRION_VERSION: ${{ inputs.version }}
    steps:
      - name: Use minimum supported Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - name: Validate the requested version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TEKRION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $TEKRION_VERSION" >&2
            exit 1
          fi
      - name: Install the public CLI
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          npm install \
            --prefix "$install_dir" \
            --no-audit \
            --no-fund \
            --prefer-online \
            "@tekrion/cli@$TEKRION_VERSION"

      - name: Verify version, help, and initialization
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          data_dir="$RUNNER_TEMP/tekrion-registry-home"
          cli="$install_dir/node_modules/.bin/tekrion"
          actual_version="$("$cli" --version)"
          if [ "$actual_version" != "$TEKRION_VERSION" ]; then
            echo "Expected Tekrion $TEKRION_VERSION, received $actual_version" >&2
            exit 1
          fi
          "$cli" --help >/dev/null
          "$cli" init --home "$data_dir"

      - name: Verify the empty session store
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          data_dir="$RUNNER_TEMP/tekrion-registry-home"
          cli="$install_dir/node_modules/.bin/tekrion"
          sessions_json="$("$cli" sessions --home "$data_dir" --json)"
          SESSIONS_JSON="$sessions_json" node -e '
            const sessions = JSON.parse(process.env.SESSIONS_JSON);
            if (!Array.isArray(sessions) || sessions.length !== 0) {
              throw new Error(
                `Expected an empty session list, received ${JSON.stringify(sessions)}`,
              );
            }
          '

      - name: Verify doctor against a local upstream
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          data_dir="$RUNNER_TEMP/tekrion-registry-home"
          cli="$install_dir/node_modules/.bin/tekrion"
          upstream_log="tekrion-registry-upstream-${RANDOM}-${RANDOM}.txt"
          rm -f "$upstream_log"

          node -e '
            const http = require("node:http");
            const server = http.createServer((_request, response) => {
              response.writeHead(200, { "content-type": "application/json" });
              response.end("{}");
            });
            server.listen(0, "127.0.0.1", () => {
              const address = server.address();
              if (address === null || typeof address === "string") {
                throw new Error("Local upstream did not expose a TCP address");
              }
              console.log(`http://127.0.0.1:${address.port}`);
            });
          ' >"$upstream_log" &
          upstream_pid=$!
          cleanup() {
            kill "$upstream_pid" 2>/dev/null || true
            wait "$upstream_pid" 2>/dev/null || true
            rm -f "$upstream_log"
          }
          trap cleanup EXIT

          for ((attempt = 0; attempt < 100; attempt += 1)); do
            if [ -s "$upstream_log" ]; then
              break
            fi
            if ! kill -0 "$upstream_pid" 2>/dev/null; then
              wait "$upstream_pid" 2>/dev/null || true
              echo "Local upstream exited before becoming ready" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ ! -s "$upstream_log" ]; then
            echo "Timed out waiting for the local upstream" >&2
            exit 1
          fi
          upstream_origin="$(tr -d '\r\n' <"$upstream_log")"
          if [[ ! "$upstream_origin" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]; then
            echo "Local upstream returned an invalid origin: $upstream_origin" >&2
            exit 1
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            CONTROL_TOKEN_PATH="$data_dir/control.token" node -e '
              const { closeSync, fstatSync, lstatSync, openSync, statSync } = require("node:fs");
              const descriptor = openSync(process.env.CONTROL_TOKEN_PATH, "r");
              try {
                const summarize = (information) => ({
                  isFile: information.isFile(),
                  isSymbolicLink: information.isSymbolicLink(),
                  dev: information.dev.toString(),
                  ino: information.ino.toString(),
                  nlink: information.nlink.toString(),
                  size: information.size.toString(),
                });
                console.log(
                  JSON.stringify({
                    node: process.version,
                    handle: summarize(fstatSync(descriptor, { bigint: true })),
                    resolvedTarget: summarize(
                      statSync(process.env.CONTROL_TOKEN_PATH, { bigint: true }),
                    ),
                    target: summarize(
                      lstatSync(process.env.CONTROL_TOKEN_PATH, { bigint: true }),
                    ),
                  }),
                );
              } finally {
                closeSync(descriptor);
              }
            '
          fi

          set +e
          doctor_json="$("$cli" doctor \
            --home "$data_dir" \
            --upstream "$upstream_origin" \
            --proxy-port 0 \
            --control-port 0 \
            --json)"
          doctor_status=$?
          set -e
          DOCTOR_JSON="$doctor_json" DOCTOR_STATUS="$doctor_status" node -e '
            const report = JSON.parse(process.env.DOCTOR_JSON);
            const failures = report.checks.filter((check) => check.status === "fail");
            if (
              Number(process.env.DOCTOR_STATUS) !== 0 ||
              report.ok !== true ||
              failures.length !== 0
            ) {
              console.error(JSON.stringify(report, null, 2));
              throw new Error(
                `tekrion doctor failed: ${failures.map((check) => check.id).join(", ") || "nonzero exit"}`,
              );
            }
          '

      - name: Verify registry signatures
        shell: bash
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/tekrion-registry-install"
          npm audit signatures --prefix "$install_dir"
