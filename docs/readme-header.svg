<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Tekrion</title>
  <desc id="description">Local evidence for AI coding agents. Record, reconstruct, explain.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f10" />
      <stop offset="0.55" stop-color="#101819" />
      <stop offset="1" stop-color="#151c1d" />
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ec6c1" />
      <stop offset="0.52" stop-color="#aaa0dc" />
      <stop offset="1" stop-color="#e8a84c" />
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ec6c1" stop-opacity="0" />
      <stop offset="0.2" stop-color="#6ec6c1" />
      <stop offset="0.8" stop-color="#aaa0dc" />
      <stop offset="1" stop-color="#e8a84c" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#6ec6c1" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#2a3636" stroke-width="2" />

  <g transform="translate(72 78)">
    <rect width="112" height="112" rx="20" fill="#101516" stroke="#e8a84c" stroke-width="2" />
    <circle cx="56" cy="56" r="35" fill="none" stroke="#2a3636" stroke-width="2" />
    <path d="M24 58h18l8-24 13 48 10-32 8 8h9" fill="none" stroke="url(#wordmark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="58" r="4" fill="#6ec6c1" />
    <circle cx="90" cy="58" r="4" fill="#e8a84c" />
  </g>

  <text x="218" y="156" fill="url(#wordmark)" filter="url(#glow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="800" letter-spacing="10">TEKRION</text>
  <text x="224" y="202" fill="#d9e2df" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21" font-weight="600" letter-spacing="4">LOCAL EVIDENCE FOR AI CODING AGENTS</text>
  <text x="224" y="242" fill="#81908c" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" letter-spacing="1.5">Record  ·  Reconstruct  ·  Explain</text>

  <path d="M72 278 H1128" stroke="url(#trace)" stroke-width="2" />
  <circle cx="180" cy="278" r="5" fill="#6ec6c1" />
  <circle cx="600" cy="278" r="5" fill="#aaa0dc" />
  <circle cx="1020" cy="278" r="5" fill="#e8a84c" />
</svg>
